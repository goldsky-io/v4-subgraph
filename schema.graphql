type PoolManager @entity(immutable: false) {
  # poolManager address
  id: ID!
  # amount of pools created
  poolCount: BigInt!
  # amoutn of transactions all time
  txCount: BigInt!
  # total volume all time in derived USD
  totalVolumeUSD: BigDecimal!
  # total volume all time in derived ETH
  totalVolumeETH: BigDecimal!
  # total swap fees all time in USD
  totalFeesUSD: BigDecimal!
  # total swap fees all time in USD
  totalFeesETH: BigDecimal!
  # all volume even through less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # TVL derived in USD
  totalValueLockedUSD: BigDecimal!
  # TVL derived in ETH
  totalValueLockedETH: BigDecimal!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # TVL derived in ETH untracked
  totalValueLockedETHUntracked: BigDecimal!
  # current owner of the factory
  owner: ID!
}

# stores for USD calculations
type Bundle @entity(immutable: false) {
  id: ID!
  # price of ETH in usd
  ethPriceUSD: BigDecimal!
}

type Token @entity(immutable: false) {
  # token address
  id: ID!
  # token symbol
  symbol: String!
  # token name
  name: String!
  # token decimals
  decimals: BigInt!
  # token total supply
  totalSupply: BigInt!
  # volume in token units
  volume: BigDecimal!
  # volume in derived USD
  volumeUSD: BigDecimal!
  # volume in USD even on pools with less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # transactions across all pools that include this token
  txCount: BigInt!
  # number of pools containing this token
  poolCount: BigInt!
  # liquidity across all pools in token units
  totalValueLocked: BigDecimal!
  # liquidity across all pools in derived USD
  totalValueLockedUSD: BigDecimal!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # Note: for chains where ETH is not the native token, this will be the derived
  # price of that chain's native token, effectively, this should be renamed
  # derivedNative
  derivedETH: BigDecimal!
}

type Pool @entity(immutable: false) {
  # pool address
  id: ID!
  # creation
  createdAtTimestamp: BigInt!
  # block pool was created at
  createdAtBlockNumber: BigInt!
  # token0
  token0: Token!
  # token1
  token1: Token!
  # fee amount
  feeTier: BigInt!
  # in range liquidity
  liquidity: BigInt!
  # current price tracker
  sqrtPrice: BigInt!
  # token0 per token1
  token0Price: BigDecimal!
  # token1 per token0
  token1Price: BigDecimal!
  # current tick
  tick: BigInt
  # tick spacing
  tickSpacing: BigInt!
  # current observation index
  observationIndex: BigInt!
  # all time token0 swapped
  volumeToken0: BigDecimal!
  # all time token1 swapped
  volumeToken1: BigDecimal!
  # all time USD swapped
  volumeUSD: BigDecimal!
  # all time USD swapped, unfiltered for unreliable USD pools
  untrackedVolumeUSD: BigDecimal!
  # fees in USD
  feesUSD: BigDecimal!
  # all time number of transactions
  txCount: BigInt!
  # all time fees collected token0
  collectedFeesToken0: BigDecimal!
  # all time fees collected token1
  collectedFeesToken1: BigDecimal!
  # all time fees collected derived USD
  collectedFeesUSD: BigDecimal!
  # total token 0 across all ticks
  totalValueLockedToken0: BigDecimal!
  # total token 1 across all ticks
  totalValueLockedToken1: BigDecimal!
  # tvl derived ETH
  totalValueLockedETH: BigDecimal!
  # tvl USD
  totalValueLockedUSD: BigDecimal!
  # true when TVL is sourced from an external hook rather than derived pricing
  isExternalLiquidity: Boolean!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # Fields used to help derived relationship
  liquidityProviderCount: BigInt! # used to detect new exchanges
  # hooks address
  hooks: String!
  # derived fields
  modifyLiquiditys: [ModifyLiquidity!]! @derivedFrom(field: "pool")
  swaps: [Swap!]! @derivedFrom(field: "pool")
  ticks: [Tick!]! @derivedFrom(field: "pool")
}

type Tick @entity(immutable: false) {
  # format: <pool address>#<tick index>
  id: ID!
  # pool address
  poolAddress: String
  # tick index
  tickIdx: BigInt!
  # pointer to pool
  pool: Pool!
  # total liquidity pool has as tick lower or upper
  liquidityGross: BigInt!
  # how much liquidity changes when tick crossed
  liquidityNet: BigInt!
  # calculated price of token0 of tick within this pool - constant
  price0: BigDecimal!
  # calculated price of token1 of tick within this pool - constant
  price1: BigDecimal!
  # created time
  createdAtTimestamp: BigInt!
  # created block
  createdAtBlockNumber: BigInt!
}

type Transaction @entity(immutable: true) {
  # txn hash
  id: Bytes!
  # block txn was included in
  blockNumber: BigInt!
  # timestamp txn was confirmed
  timestamp: BigInt!
  # gas used during txn execution
  gasUsed: BigInt!
  gasPrice: BigInt!
  # derived values
  modifyLiquiditys: [ModifyLiquidity]! @derivedFrom(field: "transaction")
  swaps: [Swap]! @derivedFrom(field: "transaction")
  transfers: [Transfer]! @derivedFrom(field: "transaction")
  subscriptions: [Subscribe]! @derivedFrom(field: "transaction")
  unsubscriptions: [Unsubscribe]! @derivedFrom(field: "transaction")
}

type Swap @entity(immutable: true) {
  # transaction hash concatenated with the event log index
  id: Bytes!
  # pointer to transaction
  transaction: Transaction!
  # timestamp of transaction
  timestamp: BigInt!
  # pool swap occured within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # sender of the swap
  sender: Bytes!
  # recipient of the swap
  # recipient: Bytes
  # txn origin
  origin: Bytes! # the EOA that initiated the txn
  # delta of token0 swapped
  amount0: BigDecimal!
  # delta of token1 swapped
  amount1: BigDecimal!
  # derived info
  amountUSD: BigDecimal!
  # The sqrt(price) of the pool after the swap, as a Q64.96
  sqrtPriceX96: BigInt!
  # the tick after the swap
  tick: BigInt!
  # index within the txn
  logIndex: BigInt
}

type ModifyLiquidity @entity(immutable: true) {
  # transaction hash concatenated with the event log index
  id: Bytes!
  # which txn the ModifyLiquidity was included in
  transaction: Transaction!
  # time of txn
  timestamp: BigInt!
  # pool position is within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # owner of position where liquidity modified to
  # owner: Bytes
  # the address that modified the liquidity
  sender: Bytes
  # txn origin
  origin: Bytes! # the EOA that initiated the txn
  # amount of liquidity modified
  amount: BigInt!
  # amount of token 0 modified
  amount0: BigDecimal!
  # amount of token 1 modified
  amount1: BigDecimal!
  # derived amount based on available prices of tokens
  amountUSD: BigDecimal
  # lower tick of the position
  tickLower: BigInt!
  # upper tick of the position
  tickUpper: BigInt!
  # index within the txn
  logIndex: BigInt
}

type Position @entity(immutable: false) {
  # tokenId
  id: ID!
  # tokenId
  tokenId: BigInt!
  # address of current owner
  owner: String!
  # the EOA that minted the position
  origin: String!
  # created time
  createdAtTimestamp: BigInt!
  # subscribe events
  subscriptions: [Subscribe!]! @derivedFrom(field: "position")
  # unsubscription events
  unsubscriptions: [Unsubscribe!]! @derivedFrom(field: "position")
  # transfer events
  transfers: [Transfer!]! @derivedFrom(field: "position")
}

type Subscribe @entity(immutable: true) {
  # transaction hash concatenated with the event log index
  id: Bytes!
  # token id of position subscribed to
  tokenId: BigInt!
  # address of subscriber
  address: String!
  # pointer to transaction
  transaction: Transaction!
  # log index
  logIndex: BigInt!
  # time of tx
  timestamp: BigInt!
  # the EOA that initiated the tx
  origin: String!
  # pointer to position
  position: Position!
}

type Unsubscribe @entity(immutable: true) {
  # transaction hash concatenated with the event log index
  id: Bytes!
  # token id of position unsubscribed from
  tokenId: BigInt!
  # address of unsubscriber
  address: String!
  # pointer to transaction
  transaction: Transaction!
  # log index
  logIndex: BigInt!
  # time of tx
  timestamp: BigInt!
  # the EOA that initiated the tx
  origin: String!
  # pointer to position
  position: Position!
}

type Transfer @entity(immutable: true) {
  # transaction hash concatenated with the event log index
  id: Bytes!
  # token id of position
  tokenId: BigInt!
  # address of previous owner
  from: String!
  # address of new owner
  to: String!
  # pointer to transaction
  transaction: Transaction!
  # log index
  logIndex: BigInt!
  # time of tx
  timestamp: BigInt!
  # the EOA that initiated the tx
  origin: String!
  # pointer to position
  position: Position!
}

type EulerSwapHook @entity(immutable: false) {
  # Composite key = eulerAccount-asset0-asset1
  id: ID!
  # The latest hook address for this key
  hook: String!
  # address of the euler account
  eulerAccount: String!
  # address of asset0
  asset0: String!
  # address of asset1
  asset1: String!
}

type ArrakisHook @entity(immutable: false) {
  # hook address
  id: ID!
  # module address that created this hook
  module: Bytes!
  # salt used in creation
  salt: Bytes!
  # timestamp of creation
  createdAtTimestamp: BigInt!
  # block number of creation
  createdAtBlockNumber: BigInt!
}
# Pools whitelisted for pricing a token, split off Token so the hot
# pricing walk loads a small row and Token loads stop carrying the array
type TokenWhitelist @entity(immutable: false) {
  # token address
  id: ID!
  # pool ids usable to derive the token's native price
  pools: [String!]!
}

# Raw per-event pool datapoints; graph-node rolls these up into PoolStats
type PoolData @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  pool: Pool!
  # deltas contributed by this event
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal!
  untrackedVolumeUSD: BigDecimal!
  feesUSD: BigDecimal!
  # pool state after this event
  liquidity: BigInt!
  sqrtPrice: BigInt!
  token0Price: BigDecimal!
  token1Price: BigDecimal!
  tick: BigInt!
  tvlUSD: BigDecimal!
}

# Replaces PoolDayData / PoolHourData; query with interval: hour | day
type PoolStats @aggregation(intervals: ["hour", "day"], source: "PoolData") {
  id: Int8!
  timestamp: Timestamp!
  pool: Pool!
  volumeToken0: BigDecimal! @aggregate(fn: "sum", arg: "volumeToken0")
  volumeToken1: BigDecimal! @aggregate(fn: "sum", arg: "volumeToken1")
  volumeUSD: BigDecimal! @aggregate(fn: "sum", arg: "volumeUSD")
  untrackedVolumeUSD: BigDecimal! @aggregate(fn: "sum", arg: "untrackedVolumeUSD")
  feesUSD: BigDecimal! @aggregate(fn: "sum", arg: "feesUSD")
  txCount: Int8! @aggregate(fn: "count")
  open: BigDecimal! @aggregate(fn: "first", arg: "token0Price")
  high: BigDecimal! @aggregate(fn: "max", arg: "token0Price")
  low: BigDecimal! @aggregate(fn: "min", arg: "token0Price")
  close: BigDecimal! @aggregate(fn: "last", arg: "token0Price")
  token0Price: BigDecimal! @aggregate(fn: "last", arg: "token0Price")
  token1Price: BigDecimal! @aggregate(fn: "last", arg: "token1Price")
  liquidity: BigInt! @aggregate(fn: "last", arg: "liquidity")
  sqrtPrice: BigInt! @aggregate(fn: "last", arg: "sqrtPrice")
  tick: BigInt! @aggregate(fn: "last", arg: "tick")
  tvlUSD: BigDecimal! @aggregate(fn: "last", arg: "tvlUSD")
}

# Raw per-event token datapoints; graph-node rolls these up into TokenStats
type TokenData @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  token: Token!
  # deltas contributed by this event
  volume: BigDecimal!
  volumeUSD: BigDecimal!
  untrackedVolumeUSD: BigDecimal!
  feesUSD: BigDecimal!
  # token state after this event
  priceUSD: BigDecimal!
  totalValueLocked: BigDecimal!
  totalValueLockedUSD: BigDecimal!
}

# Replaces TokenDayData / TokenHourData; query with interval: hour | day
type TokenStats @aggregation(intervals: ["hour", "day"], source: "TokenData") {
  id: Int8!
  timestamp: Timestamp!
  token: Token!
  volume: BigDecimal! @aggregate(fn: "sum", arg: "volume")
  volumeUSD: BigDecimal! @aggregate(fn: "sum", arg: "volumeUSD")
  untrackedVolumeUSD: BigDecimal! @aggregate(fn: "sum", arg: "untrackedVolumeUSD")
  feesUSD: BigDecimal! @aggregate(fn: "sum", arg: "feesUSD")
  open: BigDecimal! @aggregate(fn: "first", arg: "priceUSD")
  high: BigDecimal! @aggregate(fn: "max", arg: "priceUSD")
  low: BigDecimal! @aggregate(fn: "min", arg: "priceUSD")
  close: BigDecimal! @aggregate(fn: "last", arg: "priceUSD")
  priceUSD: BigDecimal! @aggregate(fn: "last", arg: "priceUSD")
  totalValueLocked: BigDecimal! @aggregate(fn: "last", arg: "totalValueLocked")
  totalValueLockedUSD: BigDecimal! @aggregate(fn: "last", arg: "totalValueLockedUSD")
}

# Raw per-event protocol datapoints; graph-node rolls these up into ProtocolStats
type ProtocolData @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  # deltas contributed by this event
  volumeETH: BigDecimal!
  volumeUSD: BigDecimal!
  untrackedVolumeUSD: BigDecimal!
  feesUSD: BigDecimal!
  # protocol state after this event
  tvlUSD: BigDecimal!
}

# Replaces UniswapDayData; query with interval: hour | day.
# txCount is cumulative to match the old UniswapDayData.txCount snapshot.
type ProtocolStats @aggregation(intervals: ["hour", "day"], source: "ProtocolData") {
  id: Int8!
  timestamp: Timestamp!
  volumeETH: BigDecimal! @aggregate(fn: "sum", arg: "volumeETH")
  volumeUSD: BigDecimal! @aggregate(fn: "sum", arg: "volumeUSD")
  volumeUSDUntracked: BigDecimal! @aggregate(fn: "sum", arg: "untrackedVolumeUSD")
  feesUSD: BigDecimal! @aggregate(fn: "sum", arg: "feesUSD")
  txCount: Int8! @aggregate(fn: "count", cumulative: true)
  tvlUSD: BigDecimal! @aggregate(fn: "last", arg: "tvlUSD")
}
